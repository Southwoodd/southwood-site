# Сайт. Сначала как new.southwood.pw для просмотра, при переезде добавить southwood.pw и www в server_name.
server {
    listen 80;
    server_name new.southwood.pw;
    root /var/www/southwood;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf;

    location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* \.(woff2|ttf|webp|svg|png|ico)$ { add_header Cache-Control "public, max-age=2592000"; }
    location / { try_files $uri $uri/ $uri.html =404; add_header Cache-Control "no-cache"; }
}
