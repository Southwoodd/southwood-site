name = "southwood-lead"
main = "lead-worker.mjs"
compatibility_date = "2026-10-01"

# Очереди повторной отправки, счетчики блога и защита от повторов
[[d1_databases]]
binding = "DB"
database_name = "southwood-lead"
database_id = "414d839e-4532-42cc-8ae3-304678e793d0"

# Первая строка: разбор очереди. Вторая: уборка отметок посетителей.
[triggers]
crons = ["* * * * *", "0 */6 * * *"]

[vars]
TG_API_BASES = "https://api.telegram.org"
ALLOWED_ORIGINS = "https://southwood.pw,https://www.southwood.pw"
SMTP_PORT = "465"
SHOW_READS = "300"
SHOW_SHARES = "20"

# Секретами (wrangler secret put): TG_BOT_TOKEN, TG_CHAT_ID, SMTP_HOST, SMTP_USER, SMTP_PASS, MAIL_TO
